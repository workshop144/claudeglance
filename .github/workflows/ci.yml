name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push to a branch/PR cancels any in-flight run for the same ref, so PR
# checks always reflect the latest commit and we don't waste runner minutes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state-guard:
    # Repo-state pattern: a PR that changes code must update STATE.md in the same PR.
    # Escape hatch: PR titles starting with "chore" or "deps" (Dependabot uses chore(deps)).
    name: STATE.md updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require STATE.md with code changes
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$TITLE" in chore*|deps*) echo "escape hatch: '$TITLE'"; exit 0 ;; esac
          changed="$(git diff --name-only "$BASE...$HEAD")"
          code="$(printf '%s\n' "$changed" | grep -E '^(Sources|Tests|Resources|scripts)/|^project\.yml$|^flake\.nix$' || true)"
          if [ -n "$code" ] && ! printf '%s\n' "$changed" | grep -qx 'STATE.md'; then
            echo "::error::Code changed without a STATE.md update:"
            printf '%s\n' "$code"
            exit 1
          fi
          echo "ok"

  test:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Workflows pinned and release provenance attested
        run: scripts/check-workflows.sh

      - name: flake.lock pins nixpkgs
        run: scripts/check-flake-lock.sh

      - name: Run tests
        # `set -o pipefail` (and no output-swallowing pipe) is load-bearing: the
        # previous `xcodebuild | grep` form returned grep's exit code, so a failing
        # test suite — whose output still contains "failed" lines that grep matched
        # — would exit 0 and pass CI. -quiet keeps the log readable while letting
        # xcodebuild's real exit status fail the step.
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ClaudeGlance.xcodeproj \
            -scheme ClaudeGlanceTests \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Release build is signed with the hardened runtime
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ClaudeGlance.xcodeproj \
            -scheme ClaudeGlance \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            -quiet
          scripts/check-hardened-runtime.sh build/dd/Build/Products/Release/ClaudeGlance.app

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  nix:
    # Build the Nix flake (a darwin-only package that fetches the released DMG and
    # installs the .app) so the formula is verified on every push — we can't
    # `nix build` on the dev box, so CI is the safety net. Independent of the test
    # job; a broken flake shows up as its own red check.
    name: Nix flake build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the package
        # --no-update-lock-file: a missing or stale flake.lock fails the build
        # instead of silently resolving nixpkgs to today's branch head.
        run: nix build --no-update-lock-file --print-build-logs .#claudeglance

      - name: Sanity-check the result
        run: |
          test -d result/Applications/ClaudeGlance.app
          test -x result/bin/claudeglance
          echo "✓ flake produced ClaudeGlance.app and a bin/claudeglance launcher"
